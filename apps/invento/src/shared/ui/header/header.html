<header
  class="flex items-center justify-end h-20 px-8 border-b border-border/40 bg-card/80 backdrop-blur-xl"
>
  <!-- <app-brand-logo
    logoSrc="light-logo.png"
    logoSrcDark="logo.png"
    [appName]="'app_name' | translate"
    size="md"
  /> -->

  <div class="flex items-center gap-2">
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="relative !rounded-full hover:bg-primary/10 hover:text-primary transition-colors duration-200"
      [attr.aria-label]="'header_notifications' | translate"
    >
      <ng-icon name="lucideBell" size="18" />
      <span hlmBadge variant="destructive" class="absolute -top-1 -inset-e-1 px-1 text-[10px]"
        >3</span
      >
    </button>

    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="!rounded-full hover:bg-primary/10 hover:text-primary transition-colors duration-200"
      (click)="toggleTheme()"
      [attr.aria-label]="'theme_switch' | translate"
    >
      @if (isDark()) {
        <ng-icon name="lucideSun" size="18" />
      } @else {
        <ng-icon name="lucideMoon" size="18" />
      }
    </button>

    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="!rounded-full hover:bg-primary/10 hover:text-primary transition-colors duration-200"
      (click)="switchLocale()"
      [attr.aria-label]="'lang_switch' | translate"
    >
      <ng-icon name="lucideGlobe" size="18" />
    </button>

    <hlm-avatar
      class="ms-4 cursor-pointer transition-all duration-300 hover:scale-110 shadow-sm ring-2 ring-transparent hover:ring-primary/50"
      routerLink="/profile"
      title="Account Settings Profile"
    >
      <img src="https://i.pravatar.cc/40?u=admin" alt="Avatar" hlmAvatarImage />
      <span hlmAvatarFallback>AD</span>
    </hlm-avatar>
  </div>
</header>
