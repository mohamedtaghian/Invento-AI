<div hlmCard class="flex flex-col gap-3 p-5">
  <div class="flex justify-between items-center">
    <span class="flex items-center gap-2 text-muted-foreground text-sm">
      <ng-content select="[icon]" />
      {{ label() }}
    </span>
    <span hlmBadge variant="secondary" class="bg-emerald-50 text-emerald-600">
      ↗ {{ change() }}%
    </span>
  </div>
  <div class="font-semibold text-2xl">{{ value() }}</div>
  <div class="-mt-2 text-muted-foreground text-xs">vs. previous period</div>
  <app-sparkline [data]="trend()" [color]="color()" />
</div>
