<section class="mb-8 orders-hero-anim">
  <div
    class="flex lg:flex-row flex-col-reverse justify-between lg:items-center gap-4 bg-card shadow-sm p-4 border border-border rounded-2xl"
  >
    <!-- Category Filter Tabs -->
    <div
      class="flex items-center gap-2 orders-filter-scroller pb-2 lg:pb-0 w-full lg:w-auto min-w-0 overflow-x-auto"
    >
      @for (tab of filterTabs; track tab.id) {
        <button
          type="button"
          (click)="onFilterChange(tab.id)"
          class="flex items-center gap-2 px-3.5 sm:px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm whitespace-nowrap transition-all duration-200 cursor-pointer shrink-0"
          [ngClass]="
            ordersService.selectedFilter() === tab.id
              ? 'bg-primary text-primary-foreground shadow-sm'
              : 'bg-muted/50 text-muted-foreground hover:bg-muted hover:text-foreground'
          "
        >
          <span>{{ tab.label }}</span>
          <span
            class="px-1.5 py-0.5 rounded-full font-bold text-[11px]"
            [ngClass]="
              ordersService.selectedFilter() === tab.id
                ? 'bg-primary-foreground/20 text-primary-foreground'
                : 'bg-muted-foreground/15 text-muted-foreground'
            "
          >
            {{ getCountForFilter(tab.id) }}
          </span>
        </button>
      }
    </div>

    <!-- Search Input -->
    <div class="relative w-full lg:w-72 xl:w-80 shrink-0">
      <span
        class="left-3.5 absolute inset-y-0 flex items-center text-muted-foreground pointer-events-none"
      >
        <ng-icon name="lucideSearch" class="text-base"></ng-icon>
      </span>
      <input
        type="text"
        [value]="ordersService.searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Search order # or item..."
        class="bg-background py-2.5 pr-10 pl-10 border border-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/40 w-full text-foreground placeholder:text-muted-foreground text-sm transition-all"
      />
      @if (ordersService.searchQuery().length > 0) {
        <button
          type="button"
          (click)="clearSearch()"
          aria-label="Clear search"
          class="right-3.5 absolute inset-y-0 flex items-center text-muted-foreground hover:text-foreground cursor-pointer"
        >
          <ng-icon name="lucideCircleX" class="text-base"></ng-icon>
        </button>
      }
    </div>
  </div>
</section>
