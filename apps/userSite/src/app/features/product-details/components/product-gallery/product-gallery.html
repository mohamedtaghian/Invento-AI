@let images = store.product()?.images ?? []; @let activeIdx = activeIndex();
@let active = activeImage(); @let name = store.product()?.name ?? '';

<div class="flex flex-col-reverse gap-3 md:flex-row">
  <div class="flex gap-3 overflow-x-auto pb-1 md:w-24 md:flex-col md:overflow-y-auto md:pb-0">
    @for (img of images; track img.id; let i = $index) {
      <button
        type="button"
        (click)="selectImage(i)"
        [attr.aria-pressed]="i === activeIdx"
        [attr.aria-label]="'View image ' + (i + 1) + ' of ' + name"
        class="h-20 w-20 shrink-0 overflow-hidden rounded-lg border-2 bg-card transition-colors md:h-24 md:w-full"
        [class.border-primary]="i === activeIdx"
        [class.border-border]="i !== activeIdx"
      >
        <img [src]="img.src" [alt]="img.alt" class="h-full w-full object-cover" />
      </button>
    }
  </div>

  <div
    class="group relative aspect-square flex-grow overflow-hidden rounded-xl border border-border bg-card shadow-sm"
  >
    @if (active) {
      <img [src]="active.src" [alt]="active.alt" class="h-full w-full object-cover" />
    }
  </div>
</div>
