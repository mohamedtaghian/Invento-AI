@let p = product();

<section
  hlmCard
  class="group cursor-pointer overflow-hidden transition-shadow hover:shadow-md"
  [routerLink]="['/product-details', p.id]"
>
  <div class="relative h-[200px] overflow-hidden bg-muted">
    <img
      [src]="p.image.src"
      [alt]="p.image.alt"
      class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
    />
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="absolute right-3 top-3 bg-background/80 backdrop-blur-sm"
      aria-label="Add to wishlist"
    >
      <ng-icon name="lucideHeart" size="sm" />
    </button>
  </div>

  <div hlmCardContent class="p-4">
    <p class="mb-1 text-xs font-semibold text-primary">{{ p.category }}</p>
    <h3 class="mb-1 truncate font-semibold text-foreground">{{ p.name }}</h3>
    <div class="flex items-center justify-between">
      <span class="font-bold text-foreground">{{ p.price | currency }}</span>
      <span class="flex items-center text-xs text-muted-foreground">
        <ng-icon name="lucideStar" class="text-yellow-500 me-1" size="sm" />
        {{ p.rating }}
      </span>
    </div>
  </div>
</section>
