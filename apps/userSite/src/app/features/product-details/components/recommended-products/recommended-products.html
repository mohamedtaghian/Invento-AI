@if (products.length) {
  <section class="mt-12 border-t border-border pt-12">
    <h2 class="mb-6 text-xl font-semibold text-foreground">Recommended for You</h2>
    <div class="flex overflow-x-auto gap-6 pb-2 snap-x">
      @for (product of products; track product.id) {
        <div class="min-w-[280px] w-[280px] shrink-0 snap-start">
          <app-product-card [product]="product" />
        </div>
      }
    </div>
  </section>
}
