<button
  hlmBtn
  variant="outline"
  size="icon"
  [disabled]="store.quantity() <= 1"
  (click)="store.decrement()"
  aria-label="Decrease quantity"
>
  <ng-icon name="lucideMinus" size="sm" />
</button>

<span class="flex w-10 items-center justify-center text-sm font-semibold" aria-live="polite">
  {{ store.quantity() }}
</span>

<button
  hlmBtn
  variant="outline"
  size="icon"
  (click)="store.increment()"
  aria-label="Increase quantity"
>
  <ng-icon name="lucidePlus" size="sm" />
</button>
