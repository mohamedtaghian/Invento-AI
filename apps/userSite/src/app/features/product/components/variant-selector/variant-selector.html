@let p = store.product()!;

<div class="mb-6 space-y-5">
  <div>
    <h3 class="mb-2 text-sm font-semibold text-foreground">
      Color:
      <span class="font-normal text-muted-foreground">{{ store.selectedColor()?.label }}</span>
    </h3>
    <div class="flex gap-3">
      @for (color of p.colors; track color.id) {
        <button
          type="button"
          [attr.aria-label]="'Select ' + color.label"
          [attr.aria-pressed]="color.id === store.selectedColor()?.id"
          (click)="store.selectColor(color.id)"
          class="h-10 w-10 rounded-full border border-border shadow-sm transition-shadow"
          [style.background-color]="color.hex"
          [class.ring-2]="color.id === store.selectedColor()?.id"
          [class.ring-primary]="color.id === store.selectedColor()?.id"
          [class.ring-offset-2]="color.id === store.selectedColor()?.id"
        ></button>
      }
    </div>
  </div>

  <div>
    <div class="mb-2 flex items-center justify-between">
      <h3 class="text-sm font-semibold text-foreground">Case Size</h3>
      <a href="#" class="text-sm text-primary hover:underline">Sizing Guide</a>
    </div>
    <div class="grid grid-cols-2 gap-3">
      @for (size of p.sizes; track size.id) {
        <button
          type="button"
          [attr.aria-label]="'Select size ' + size.label"
          [attr.aria-pressed]="size.id === store.selectedSize()?.id"
          (click)="store.selectSize(size.id)"
          class="rounded-lg border px-4 py-2 text-sm font-medium transition-colors"
          [class.border-primary]="size.id === store.selectedSize()?.id"
          [class.bg-primary/5]="size.id === store.selectedSize()?.id"
          [class.text-primary]="size.id === store.selectedSize()?.id"
          [class.border-border]="size.id !== store.selectedSize()?.id"
          [class.text-muted-foreground]="size.id !== store.selectedSize()?.id"
          [class.hover:border-primary/50]="size.id !== store.selectedSize()?.id"
        >
          {{ size.label }}
        </button>
      }
    </div>
  </div>
</div>
