
<div class="mb-6 space-y-3">
  @if (store.canAddToCart()) {
    <p class="flex items-center text-sm font-medium text-green-700">
      <ng-icon name="lucideCircleCheck" class="me-1" size="sm" />
      In Stock
    </p>
  } @else {
    <p class="flex items-center text-sm font-medium text-red-700">
      Out of Stock
    </p>
  }

  <div class="flex gap-3 items-center">
    <app-quantity-stepper />

    <button hlmBtn class="flex-grow" [disabled]="!store.canAddToCart()" (click)="addToCart($event)">
      <ng-icon name="lucideShoppingCart" class="me-1" />
      Add to Cart
    </button>

    <button
      hlmBtn
      variant="outline"
      size="icon"
      [attr.aria-pressed]="store.isWishlisted()"
      (click)="toggleWishlist($event)"
      aria-label="Toggle wishlist"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        [attr.fill]="store.isWishlisted() ? 'text-red-500' : 'none'"
      >
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
        />
      </svg>
    </button>
  </div>

  <button hlmBtn variant="secondary" class="w-full">
    Buy with <span class="ms-1 font-bold">AuraPay</span>
  </button>
</div>
