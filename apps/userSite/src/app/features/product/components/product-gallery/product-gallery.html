@let images = store.product()?.images ?? []; @let activeIdx = activeIndex();
@let active = activeImage(); @let name = store.product()?.title ?? '';

<div class="flex flex-col-reverse gap-3 md:flex-row">
  <div class="flex gap-3 overflow-x-auto pb-1 md:w-24 md:flex-col md:overflow-y-auto md:pb-0">
    @for (img of images; track img.url || $index; let i = $index) {
      <button
        type="button"
        (click)="selectImage(i)"
        [attr.aria-pressed]="i === activeIdx"
        [attr.aria-label]="'View image ' + (i + 1) + ' of ' + name"
        class="h-20 w-20 shrink-0 overflow-hidden rounded-lg border-2 bg-card transition-colors md:h-24 md:w-full"
        [class.border-primary]="i === activeIdx"
        [class.border-border]="i !== activeIdx"
      >
        <img [src]="img.url" [alt]="img.altText || ''" class="h-full w-full object-cover" />
      </button>
    }
  </div>

  <div
    class="group relative aspect-square flex-grow overflow-hidden rounded-xl border border-border bg-card shadow-sm"
  >
    @if (active) {
      <img [src]="active.url" [alt]="active.altText || ''" class="h-full w-full object-cover" />
    }

    <button
      type="button"
      (click)="toggleWishlist($event)"
      class="top-3 right-3 absolute flex justify-center items-center bg-card shadow rounded-full w-8 h-8 transition-all duration-200"
      [class.text-red-500]="store.isWishlisted()"
      [class.text-muted-foreground]="!store.isWishlisted()"
      [class.scale-125]="store.isWishlisted()"
      aria-label="Toggle wishlist"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        [attr.fill]="store.isWishlisted() ? 'currentColor' : 'none'"
      >
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
        />
      </svg>
    </button>
  </div>
</div>
