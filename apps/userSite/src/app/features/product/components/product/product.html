<section class="px-4 sm:px-8 md:px-16 lg:px-24 pt-4 pb-10">
  <app-products-toolbar
    title="Products"
    [count]="filteredProducts().length"
    [sort]="sort()"
    (sortChange)="onSortChange($event)"
    (searchChange)="onSearchChange($event)"
  />

  <div class="flex md:flex-row flex-col gap-10 mt-6">
    <aside class="w-full md:w-64 shrink-0">
      <app-filters-sidebar
        [categories]="categories()"
        [colors]="colors"
        [selectedColor]="selectedColor()"
        [maxPrice]="maxPrice()"
        [inStock]="inStock()"
        [onlyDiscount]="onlyDiscount()"
        (categoryToggle)="onCategoryToggle($event)"
        (colorSelect)="onColorSelect($event)"
        (priceChange)="onPriceChange($event)"
        (clearAll)="onClearAll()"
        (inStockChange)="onInStockChange($event)"
        (discountChange)="onDiscountChange($event)"
      />
    </aside>

    <div class="flex flex-col flex-1 gap-6">
      <div class="products-grid-wrapper px-1 py-2 overflow-x-hidden">
        <app-products-grid [products]="pagedProducts()" />
      </div>
      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        (pageChange)="onPageChange($event)"
      />
    </div>
  </div>
</section>
