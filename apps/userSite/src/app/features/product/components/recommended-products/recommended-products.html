@if (products().length) {
  <section class="mt-12 border-t border-border pt-12">
    <h2 class="mb-6 text-xl font-semibold text-foreground">Recommended for You</h2>
    <ng-scrollbar hlm class="w-full">
      <div class="flex w-max mx-auto gap-6 p-1">
        @for (product of products(); track product.slug) {
          <div class="w-[280px] shrink-0">
            <app-product-card [product]="product" />
          </div>
        }
      </div>
    </ng-scrollbar>
  </section>
}
