<div
  class="flex sm:flex-row flex-col justify-between sm:items-center gap-3 bg-card p-4 border border-border rounded-xl"
>
  <!-- Title -->
  <div class="flex items-center gap-2 shrink-0">
    <span class="font-semibold text-foreground text-xl">{{ title() }}</span>
    <span hlmBadge variant="secondary" class="text-xs">{{ count() }} Items</span>
  </div>

  <!-- Search -->
  <div class="relative flex-1 sm:max-w-sm">
    <svg
      class="top-1/2 left-3 absolute w-4 h-4 text-muted-foreground -translate-y-1/2 pointer-events-none"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </svg>
    <input
      type="search"
      placeholder="Search products..."
      (input)="onSearchInput($event)"
      class="bg-background py-1.5 pr-4 pl-9 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-ring w-full text-foreground text-sm"
    />
  </div>

  <!-- Sort -->
  <div class="flex items-center gap-2 shrink-0">
    <span class="text-muted-foreground text-sm">Sort by:</span>
    <select
      [value]="sort()"
      (change)="onSortChange($event)"
      class="bg-background py-1.5 pr-8 pl-3 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-ring text-foreground text-sm cursor-pointer"
    >
      <option value="recommended" class="bg-background text-foreground">Recommended</option>
      <option value="best-seller" class="bg-background text-foreground">Best Seller</option>
      <option value="price-asc" class="bg-background text-foreground">Price: Low to High</option>
      <option value="price-desc" class="bg-background text-foreground">Price: High to Low</option>
      <option value="newest" class="bg-background text-foreground">Newest Arrivals</option>
    </select>
  </div>
</div>
