<div class="flex sm:flex-row flex-col justify-between sm:items-center gap-3 bg-card p-4 border border-border rounded-xl">
  <!-- Title -->
  <div class="flex items-center gap-2 shrink-0">
    <span class="font-semibold text-foreground text-xl">{{ title() }}</span>
    <span hlmBadge variant="secondary" class="text-xs">{{ count() }} Items</span>
  </div>

  <!-- Search -->
  <div class="relative flex-1 sm:max-w-sm">
    <svg
      class="top-1/2 left-3 absolute w-4 h-4 text-muted-foreground -translate-y-1/2 pointer-events-none"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </svg>
    <input
      type="search"
      placeholder="Search products..."
      (input)="onSearchInput($event)"
      (keyup.enter)="onSearchEnter($event)"
      class="bg-background py-1.5 pr-4 pl-9 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-ring w-full text-foreground text-sm"
    />

    <!-- Suggestions Dropdown -->
    @if (showSuggestions()) {
      <div class="absolute top-full left-0 z-50 w-full mt-1 bg-card border border-border shadow-lg rounded-lg overflow-hidden">
        @if (isLoadingSuggestions()) {
          <div class="p-3 text-sm text-muted-foreground text-center animate-pulse">Searching...</div>
        } @else if (suggestions().length > 0) {
          <ul class="max-h-60 overflow-auto flex flex-col">
            @for (suggestion of suggestions(); track suggestion.slug) {
              <li>
                <button 
                  (click)="onSuggestionClick(suggestion)"
                  class="w-full text-left px-4 py-2 hover:bg-secondary flex items-center justify-between text-sm transition-colors"
                >
                  <span class="truncate font-medium text-foreground">{{ suggestion.title }}</span>
                  <span class="text-muted-foreground shrink-0 ml-2 whitespace-nowrap">{{ suggestion.minPriceAmount / 100 | currency }}</span>
                </button>
              </li>
            }
          </ul>
        } @else {
          <div class="p-3 text-sm text-muted-foreground text-center">No products found</div>
        }
      </div>
    }
  </div>

  <!-- Sort -->
  <div class="flex items-center gap-2 shrink-0">
    <span class="text-muted-foreground text-sm">Sort by:</span>
    <select
      [value]="sort()"
      (change)="onSortChange($event)"
      class="bg-background py-1.5 pr-8 pl-3 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-ring text-foreground text-sm cursor-pointer"
    >
      <option value="relevance" class="bg-background text-foreground">Relevance</option>
      <option value="best-seller" class="bg-background text-foreground">Best Seller</option>
      <option value="price_asc" class="bg-background text-foreground">Price: Low to High</option>
      <option value="price_desc" class="bg-background text-foreground">Price: High to Low</option>
      <option value="newest" class="bg-background text-foreground">Newest Arrivals</option>
      <option value="title" class="bg-background text-foreground">Title A-Z</option>
    </select>
  </div>
</div>
