<app-breadcrumb-trail />

<main class="mx-auto px-4 md:px-8 py-8 w-full max-w-6xl grow relative min-h-[500px]">
  
  @if (isLoading()) {
    <div class="absolute inset-0 z-10 flex items-center justify-center">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
    </div>
  } @else if (notFound()) {
    <div class="py-20 text-muted-foreground text-center">
      <svg class="w-16 h-16 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <h2 class="text-xl font-semibold text-foreground mb-2">Product not found</h2>
      <p>This product might have been removed or the link is incorrect.</p>
    </div>
  } @else {
    @let p = store.product();
    @if (p) {
      <div class="gap-8 grid grid-cols-1 lg:grid-cols-12 mb-12">
        <div class="lg:col-span-7">
          <app-product-gallery />
        </div>

        <div class="flex flex-col lg:col-span-5">
          <app-product-summary />
          <hr class="my-6 border-border" />
          <app-variant-selector />
          <app-purchase-actions />
          <app-product-details-accordion />
        </div>
      </div>

      <app-recommended-products />
    }
  }
</main>
