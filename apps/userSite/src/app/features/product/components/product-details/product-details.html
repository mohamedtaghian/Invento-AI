<app-breadcrumb-trail />

<main class="mx-auto px-4 md:px-8 py-8 w-full max-w-6xl grow">
  @let p = store.product();

  @if (p) {
    <div class="gap-8 grid grid-cols-1 lg:grid-cols-12 mb-12">
      <div class="lg:col-span-7">
        <app-product-gallery />
      </div>

      <div class="flex flex-col lg:col-span-5">
        <app-product-summary />
        <hr class="my-6 border-border" />
        <app-variant-selector />
        <app-purchase-actions />
        <app-product-details-accordion />
      </div>
    </div>

    <app-recommended-products />
  } @else {
    <div class="py-20 text-muted-foreground text-center">
      <p>Product not found.</p>
    </div>
  }
</main>
