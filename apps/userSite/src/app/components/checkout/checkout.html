<div class="min-h-screen bg-[#f8f9fa] p-8 font-sans text-slate-800">
  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
    <!-- Left Column: Order Summary -->
    <div class="lg:col-span-5 fade-in-left">
      <h1 class="text-2xl font-bold mb-1">Secure Checkout</h1>
      <p class="text-sm text-slate-500 mb-8">
        Review your items and complete your purchase securely.
      </p>

      <h2 class="text-lg font-bold mb-4">Order Summary</h2>
      <hr class="border-slate-200 mb-6" />

      <!-- Product 1 -->
      <div
        class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4 mb-4"
      >
        <div class="w-20 h-20 bg-slate-100 rounded-lg overflow-hidden flex-shrink-0">
          <img
            src="https://placehold.co/150x150/e2e8f0/475569?text=Headphones"
            alt="Headphones"
            class="w-full h-full object-cover"
          />
        </div>
        <div class="flex-1">
          <h4 class="font-bold text-sm">Aura Sonic Pro Headphones</h4>
          <p class="text-xs text-slate-500 mb-2">Matte Black</p>
          <div class="flex items-center justify-between">
            <p class="font-bold text-[#005bb5]">$299.00</p>
            <div
              class="flex items-center gap-3 border border-slate-200 rounded-md px-2 py-1 bg-slate-50"
            >
              <button type="button" class="text-slate-400 hover:text-slate-600">&minus;</button>
              <span class="text-sm font-medium">1</span>
              <button type="button" class="text-slate-400 hover:text-slate-600">&plus;</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div
        class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4 mb-8"
      >
        <div class="w-20 h-20 bg-slate-100 rounded-lg overflow-hidden flex-shrink-0">
          <img
            src="https://placehold.co/150x150/e2e8f0/475569?text=Stand"
            alt="Laptop Stand"
            class="w-full h-full object-cover"
          />
        </div>
        <div class="flex-1">
          <h4 class="font-bold text-sm">Elevate Laptop Stand</h4>
          <p class="text-xs text-slate-500 mb-2">Silver</p>
          <div class="flex items-center justify-between">
            <p class="font-bold text-[#005bb5]">$89.00</p>
            <div
              class="flex items-center gap-3 border border-slate-200 rounded-md px-2 py-1 bg-slate-50"
            >
              <button type="button" class="text-slate-400 hover:text-slate-600">&minus;</button>
              <span class="text-sm font-medium">2</span>
              <button type="button" class="text-slate-400 hover:text-slate-600">&plus;</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Totals -->
      <div class="space-y-3 text-sm mb-6 px-2">
        <div class="flex justify-between">
          <span class="text-slate-600">Subtotal</span><span>$477.00</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-600">Shipping</span><span>Calculated at next step</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-600">Tax</span><span>$38.16</span>
        </div>
      </div>
      <hr class="border-slate-200 mb-6" />
      <div class="flex justify-between items-center text-xl font-bold px-2">
        <span>Total</span>
        <span class="text-[#005bb5]">$515.16</span>
      </div>
    </div>

    <!-- Right Column: Form -->
    <div class="lg:col-span-7 fade-in-right">
      <form
        [formGroup]="checkoutForm"
        (ngSubmit)="onSubmit()"
        class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm"
      >
        <!-- Step 1 -->
        <div class="mb-10">
          <div class="flex items-center gap-3 mb-6">
            <span
              class="flex items-center justify-center w-6 h-6 rounded-full bg-[#005bb5] text-white text-xs font-bold"
              >1</span
            >
            <h3 class="text-lg font-bold">Shipping Details</h3>
          </div>

          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label
                for="firstName"
                class="text-xs font-bold uppercase tracking-wider mb-2 block text-slate-700"
                >First Name</label
              >
              <input
                id="firstName"
                type="text"
                formControlName="firstName"
                placeholder="Jane"
                class="w-full border border-slate-300 rounded-md p-2.5 focus:ring-2 focus:ring-[#005bb5]/20 focus:border-[#005bb5] outline-none"
                [class.border-red-500]="
                  checkoutForm.get('firstName')?.invalid && checkoutForm.get('firstName')?.touched
                "
              />
            </div>
            <div>
              <label
                for="lastName"
                class="text-xs font-bold uppercase tracking-wider mb-2 block text-slate-700"
                >Last Name</label
              >
              <input
                id="lastName"
                type="text"
                formControlName="lastName"
                placeholder="Doe"
                class="w-full border border-slate-300 rounded-md p-2.5 focus:ring-2 focus:ring-[#005bb5]/20 focus:border-[#005bb5] outline-none"
                [class.border-red-500]="
                  checkoutForm.get('lastName')?.invalid && checkoutForm.get('lastName')?.touched
                "
              />
            </div>
          </div>

          <div class="mb-4">
            <label
              for="address"
              class="text-xs font-bold uppercase tracking-wider mb-2 block text-slate-700"
              >Address Line 1</label
            >
            <input
              id="address"
              type="text"
              formControlName="address"
              placeholder="123 Innovation Way"
              class="w-full border border-slate-300 rounded-md p-2.5 focus:ring-2 focus:ring-[#005bb5]/20 focus:border-[#005bb5] outline-none"
              [class.border-red-500]="
                checkoutForm.get('address')?.invalid && checkoutForm.get('address')?.touched
              "
            />
          </div>

          <div>
            <label
              for="city"
              class="text-xs font-bold uppercase tracking-wider mb-2 block text-slate-700"
              >City</label
            >
            <input
              id="city"
              type="text"
              formControlName="city"
              placeholder="Metropolis"
              class="w-full border border-slate-300 rounded-md p-2.5 focus:ring-2 focus:ring-[#005bb5]/20 focus:border-[#005bb5] outline-none"
              [class.border-red-500]="
                checkoutForm.get('city')?.invalid && checkoutForm.get('city')?.touched
              "
            />
          </div>
        </div>

        <!-- Step 2 -->
        <div class="mb-8">
          <div class="flex items-center gap-3 mb-6">
            <span
              class="flex items-center justify-center w-6 h-6 rounded-full bg-slate-200 text-slate-600 text-xs font-bold"
              >2</span
            >
            <h3 class="text-lg font-bold">Payment Method</h3>
          </div>

          <div class="mb-4 relative">
            <label
              for="cardNumber"
              class="text-xs font-bold uppercase tracking-wider mb-2 block text-slate-700"
              >Card Number</label
            >
            <div class="relative">
              <svg
                class="w-5 h-5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"
                ></path>
              </svg>
              <input
                id="cardNumber"
                type="text"
                formControlName="cardNumber"
                placeholder="0000 0000 0000 0000"
                class="w-full border border-slate-300 rounded-md py-2.5 pl-10 pr-3 font-mono focus:ring-2 focus:ring-[#005bb5]/20 focus:border-[#005bb5] outline-none"
                [class.border-red-500]="
                  checkoutForm.get('cardNumber')?.invalid && checkoutForm.get('cardNumber')?.touched
                "
              />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                for="expiry"
                class="text-xs font-bold uppercase tracking-wider mb-2 block text-slate-700"
                >Expiry (MM/YY)</label
              >
              <input
                id="expiry"
                type="text"
                formControlName="expiry"
                placeholder="12/25"
                class="w-full border border-slate-300 rounded-md p-2.5 focus:ring-2 focus:ring-[#005bb5]/20 focus:border-[#005bb5] outline-none"
                [class.border-red-500]="
                  checkoutForm.get('expiry')?.invalid && checkoutForm.get('expiry')?.touched
                "
              />
            </div>
            <div>
              <label
                for="cvc"
                class="text-xs font-bold uppercase tracking-wider mb-2 block text-slate-700"
                >CVC</label
              >
              <input
                id="cvc"
                type="text"
                formControlName="cvc"
                placeholder="123"
                class="w-full border border-slate-300 rounded-md p-2.5 focus:ring-2 focus:ring-[#005bb5]/20 focus:border-[#005bb5] outline-none"
                [class.border-red-500]="
                  checkoutForm.get('cvc')?.invalid && checkoutForm.get('cvc')?.touched
                "
              />
            </div>
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-[#005bb5] hover:bg-[#004a94] text-white font-bold py-3.5 rounded-lg flex items-center justify-center gap-2 transition-colors"
        >
          Pay $515.16 Securely
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
            ></path>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
