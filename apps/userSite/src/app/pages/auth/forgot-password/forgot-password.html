<div class="flex flex-col h-full text-left">
  
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight mb-2">Forgot Password</h1>
    <p class="text-sm text-slate-500 dark:text-zinc-400">
      Enter your email address and we'll send you a verification code to reset your password.
    </p>
  </div>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-5 flex-1">
    
    <div class="space-y-1.5">
      <label hlmLabel for="email" class="text-sm font-semibold text-slate-700 dark:text-white">Email Address</label>
      <input hlmInput id="email" type="email" formControlName="email" (blur)="forgotPasswordForm.get('email')?.markAsTouched()" placeholder="Email Address" class="w-full !rounded-xl !border-slate-200" />
      <div *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid" class="text-xs text-red-500 mt-1">
        Please enter a valid email address.
      </div>
    </div>

    <button hlmBtn class="w-full mt-8 !rounded-full !bg-blue-600 hover:!bg-blue-700 !py-6 text-base" type="submit" [disabled]="isLoading()">
      <span *ngIf="!isLoading()">Send Reset Code</span>
      <span *ngIf="isLoading()">Sending...</span>
    </button>
  </form>

  <div class="mt-6 text-center">
    <a routerLink="../login" class="text-sm font-semibold text-blue-500 hover:underline">
      Back to login
    </a>
  </div>

</div>
