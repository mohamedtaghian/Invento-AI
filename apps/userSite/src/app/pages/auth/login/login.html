<div class="flex flex-col h-full text-left">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight mb-2">
      Welcome Back
    </h1>
    <p class="text-sm text-slate-500 dark:text-zinc-400">
      Don't have an account?
      <a
        routerLink="../register"
        queryParamsHandling="merge"
        class="font-bold text-blue-500 hover:underline"
        >Sign up</a
      >
    </p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5 flex-1">
    <div class="space-y-1.5">
      <label hlmLabel for="email" class="text-sm font-semibold text-slate-700 dark:text-white"
        >Email Address</label
      >
      <input
        hlmInput
        id="email"
        type="email"
        formControlName="email"
        (blur)="loginForm.get('email')?.markAsTouched()"
        placeholder="Email Address"
        class="w-full !rounded-xl !border-slate-200"
      />
      @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
        <div class="text-xs text-red-500 mt-1">Please enter a valid email address.</div>
      }
    </div>

    <div class="space-y-1.5">
      <label hlmLabel for="password" class="text-sm font-semibold text-slate-700 dark:text-white"
        >Password</label
      >
      <input
        hlmInput
        id="password"
        type="password"
        formControlName="password"
        (blur)="loginForm.get('password')?.markAsTouched()"
        placeholder="Password"
        class="w-full !rounded-xl !border-slate-200"
      />
      @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
        <div class="text-xs text-red-500 mt-1">Password is required.</div>
      }
      <div class="flex items-center justify-end pt-1">
        <a
          routerLink="../forgot-password"
          queryParamsHandling="merge"
          class="text-xs font-semibold text-blue-500 hover:underline"
          >Forgot password?</a
        >
      </div>
    </div>

    <button
      hlmBtn
      class="w-full mt-8 !rounded-full !bg-blue-600 hover:!bg-blue-700 !py-6 text-base"
      type="submit"
      [disabled]="isLoading()"
    >
      @if (!isLoading()) {
        <span>Sign In</span>
      } @else {
        <span>Signing in...</span>
      }
    </button>
  </form>
</div>
