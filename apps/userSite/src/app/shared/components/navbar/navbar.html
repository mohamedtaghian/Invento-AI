<header
  class="flex justify-between items-center px-4 sm:px-8 md:px-16 lg:px-24 py-3 sticky top-0 z-90 transition-all duration-300"
  [class]="
    isScrolled()
      ? 'backdrop-blur-md bg-background/80 border-b border-border shadow-sm'
      : 'bg-transparent border-transparent'
  "
>
  <div class="flex items-center gap-2 w-1/2 md:w-2/6">
    <hlm-sheet side="left" class="md:hidden">
      <button
        hlmBtn
        hlmSheetTrigger
        variant="ghost"
        class="flex justify-center items-center w-10 h-10"
        aria-label="Toggle menu"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="6" y2="6" />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      </button>
      <hlm-sheet-content *hlmSheetPortal="let ctx">
        <hlm-sheet-header>
          <h3 hlmSheetTitle class="text-lg">Menu</h3>
        </hlm-sheet-header>
        <div class="flex flex-col gap-1 px-4">
          @for (link of links(); track link.path) {
            <button
              hlmBtn
              hlmSheetClose
              [routerLink]="link.path"
              variant="ghost"
              class="py-2 w-fit"
              routerLinkActive="bg-secondary"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              {{ link.label }}
            </button>
          }
          <hr class="my-2 border-border" />
          <button
            hlmBtn
            hlmSheetClose
            [routerLink]="['/', activeStoreSlug(), 'account-settings']"
            variant="ghost"
            class="py-2 w-fit"
            routerLinkActive="bg-secondary"
          >
            Account Settings
          </button>
        </div>
      </hlm-sheet-content>
    </hlm-sheet>
    <a [routerLink]="['/', activeStoreSlug()]" class="flex items-center gap-2 w-fit font-semibold">
      <img src="/logo.svg" alt="Logo" class="w-8 h-8" />
      <span>YourBrand</span>
    </a>
  </div>
  <nav hlmNavigationMenu class="hidden md:flex md:w-2/6">
    <ul hlmNavigationMenuList>
      @for (link of links(); track link.path) {
        <li hlmNavigationMenuItem>
          <a hlmNavigationMenuLink [routerLink]="link.path" [active]="currentUrl() === link.path">{{
            link.label
          }}</a>
        </li>
      }
    </ul>
  </nav>
  <div class="flex justify-end items-center gap-2 w-1/2 md:w-2/6">
    <a
      [routerLink]="['/', activeStoreSlug(), 'account-settings']"
      routerLinkActive="bg-secondary text-foreground"
      class="flex justify-center items-center hover:bg-secondary rounded-full w-10 h-10 text-muted-foreground hover:text-foreground transition-colors"
      aria-label="Account settings"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20 21a8 8 0 0 0-16 0" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    </a>
    <a
      [routerLink]="['/', activeStoreSlug(), 'checkout']"
      id="cart-icon"
      class="relative flex justify-center items-center bg-primary hover:bg-primary/90 shadow-xl rounded-full w-12 h-12 text-primary-foreground transition-transform hover:scale-105"
      aria-label="Shopping Cart"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="8" cy="21" r="1" />
        <circle cx="19" cy="21" r="1" />
        <path
          d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"
        />
      </svg>
      @if (cartService.itemCount() > 0) {
        <span
          id="cart-count"
          class="-top-1 -right-1 absolute flex justify-center items-center bg-rose-500 px-1 rounded-full min-w-[20px] h-5 font-bold text-white text-[11px] shadow-sm animate-in zoom-in-75 duration-150"
        >
          {{ cartService.itemCount() > 99 ? '99+' : cartService.itemCount() }}
        </span>
      }
    </a>
  </div>
</header>
