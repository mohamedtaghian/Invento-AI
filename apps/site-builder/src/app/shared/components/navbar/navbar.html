<nav
  dir="ltr"
  class="sticky top-0 z-50 w-full border-b border-border bg-background/95 backdrop-blur-md"
>
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a
      routerLink="/"
      hlmBtn
      variant="ghost"
      class="group h-auto p-2 flex items-center gap-2"
      aria-label="INVENTO Home Page"
    >
      <img src="light-logo.png" class="h-13 w-auto dark:hidden block" alt="INVENTO Logo" />
      <img src="logo.png" class="h-13 w-auto hidden dark:block" alt="INVENTO Logo" />
    </a>

    <div class="flex items-center gap-4">
      <app-lang-switcher />
      <app-theme-switcher />

      @if (isAuthenticated()) {
        <a [href]="dashboardUrl" hlmBtn variant="outline" class="gap-2">
          <ng-icon name="lucideLayoutDashboard" class="text-sm"></ng-icon>
          Dashboard
        </a>
        <button hlmBtn variant="ghost" class="gap-2" (click)="signOut()">
          <ng-icon name="lucideLogOut" class="text-sm"></ng-icon>
          Sign Out
        </button>
      } @else {
        <a routerLink="/auth/login" hlmBtn variant="ghost">Login</a>
        <a routerLink="/auth/register" hlmBtn>Sign Up</a>
      }
    </div>
  </div>
</nav>
