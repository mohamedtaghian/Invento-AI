<div class="flex justify-center p-6 md:p-10 w-full min-h-svh">
  <div class="w-full">
    <spartan-stepper
      orientation="vertical"
      #stepper
      [linear]="true"
      (selectionChange)="onStepChange($event)"
    >
      <spartan-step
        label="Brainstorm"
        [completed]="builderState.isBrainstormComplete()"
        [stepControl]="brainstormControl"
      >
        <ng-template spartanStepContent>
          <app-brainstorm
            (dataSaved)="brainstormControl.setValue(true); stepper.next()"
          ></app-brainstorm>
        </ng-template>
      </spartan-step>
      <spartan-step
        label="AI Interview"
        [completed]="builderState.isAiInterviewComplete()"
        [stepControl]="aiInterviewControl"
      >
        <ng-template spartanStepContent>
          <app-ai-interview (dataSaved)="onAiInterviewDone()"></app-ai-interview>
        </ng-template>
      </spartan-step>
      <spartan-step
        label="Preview"
        [completed]="builderState.isPreviewComplete()"
        [stepControl]="previewControl"
      >
        <ng-template spartanStepContent>
          <app-preview (dataSaved)="previewControl.setValue(true); stepper.next()"></app-preview>
        </ng-template>
      </spartan-step>
      <spartan-step
        label="Validation"
        [completed]="builderState.isValidationComplete()"
        [stepControl]="validationControl"
      >
        <ng-template spartanStepContent>
          <app-validation (dataSaved)="validationControl.setValue(true)"></app-validation>
        </ng-template>
      </spartan-step>
    </spartan-stepper>
  </div>
</div>

@if (processingAi()) {
  <div class="ai-processing-overlay">
    <app-ai-loader></app-ai-loader>
    <div class="mt-8 text-center">
      <app-typing-text
        [words]="aiLoadingWords"
        fontSizeClasses="text-lg md:text-xl"
      ></app-typing-text>
    </div>
  </div>
}
