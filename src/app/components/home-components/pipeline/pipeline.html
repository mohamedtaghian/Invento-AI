<section
  class="flex flex-col items-center sm:items-start gap-6 px-4 sm:px-8 md:px-16 lg:px-24 py-10"
>
  <!-- Badge -->
  <span
    appScrollAnimate="fade-left"
    [animDelay]="0"
    hlmBadge
    variant="outline"
    class="px-3 py-1 font-mono text-xs tracking-widest"
  >
    BUILD_PIPELINE
  </span>

  <!-- Grid -->
  <div class="gap-4 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 w-full">
    @for (step of steps(); track step.number; let i = $index) {
      <a
        hlmCard
        appScrollAnimate="fade-up"
        [animDelay]="i * 120"
        routerLink="/brain"
        class="relative flex flex-col gap-3 hover:shadow-lg p-6 hover:ring-primary/40 overflow-hidden sm:text-left text-center no-underline transition-all duration-300 cursor-pointer pipeline-card"
        (mousemove)="onMouseMove($event)"
        (mouseleave)="onMouseLeave($event)"
      >
        <!-- Glow layer -->
        <div
          class="absolute inset-0 opacity-0 rounded-xl transition-opacity duration-300 pointer-events-none pipeline-glow"
        ></div>

        <span class="relative font-mono font-bold text-muted-foreground/40 text-3xl">
          {{ step.number }}
        </span>
        <div hlmCardHeader class="relative gap-1 p-0">
          <h3 hlmCardTitle class="font-semibold text-base">{{ step.title }}</h3>
          <p hlmCardDescription class="font-mono text-xs">{{ step.subtitle }}</p>
        </div>
      </a>
    }
  </div>
</section>
