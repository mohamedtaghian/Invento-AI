<section class="px-8 md:px-16 lg:px-24 py-16 flex flex-col gap-8">
  <!-- Badge -->
  <div class="border border-primary/40 rounded px-3 py-1 w-fit">
    <span class="text-primary text-xs font-mono tracking-widest">BUILD_PIPELINE</span>
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (step of steps(); track step.number) {
      <div
        class="border border-border rounded-lg p-6 flex flex-col gap-3 bg-card hover:border-primary/40 transition-colors duration-200"
      >
        <span class="text-muted-foreground/40 font-mono text-3xl font-bold">
          {{ step.number }}
        </span>
        <h3 class="text-foreground font-semibold text-lg">{{ step.title }}</h3>
        <p class="text-muted-foreground text-sm font-mono">{{ step.subtitle }}</p>
      </div>
    }
  </div>
</section>
