<section class="px-4 sm:px-8 md:px-16 lg:px-24 py-10">
  <div class="bg-border w-full h-px"></div>

  <div class="gap-6 grid grid-cols-2 sm:grid-cols-4 py-6">
    @for (stat of stats(); track stat.label) {
      <div class="flex flex-col items-center sm:items-start gap-1 sm:text-left text-center">
        <span class="font-mono font-bold text-primary text-3xl">{{ stat.value }}</span>
        <span class="text-muted-foreground text-sm">{{ stat.label }}</span>
      </div>
    }
  </div>

  <div class="bg-border w-full h-px"></div>
</section>
