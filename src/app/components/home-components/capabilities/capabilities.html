<section class="px-8 md:px-16 lg:px-24 py-16">
  <div hlmCard class="gap-8 p-8">
    <!-- Label -->
    <p class="font-mono text-muted-foreground text-sm">// SYSTEM_CAPABILITIES</p>

    <!-- Grid - responsive 1col mobile / 2col desktop -->
    <div hlmCardContent class="gap-4 grid grid-cols-1 sm:grid-cols-2 p-0">
      @for (cap of capabilities(); track cap.title) {
        <div hlmCard class="flex-row items-start gap-4 p-4">
          <!-- Icon Box -->
          <div
            class="flex justify-center items-center border border-primary/40 rounded-md w-10 h-10 text-primary shrink-0"
          >
            <ng-icon [name]="cap.icon" class="text-base" />
          </div>

          <!-- Content -->
          <div hlmCardContent class="flex flex-col gap-1 p-0">
            <h3 hlmCardTitle class="font-semibold text-sm">{{ cap.title }}</h3>
            <p hlmCardDescription class="text-sm leading-relaxed">{{ cap.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
