<section class="px-4 sm:px-8 md:px-16 lg:px-24 py-10">
  <div appScrollAnimate="fade-up" [animDelay]="0" hlmCard class="gap-6 p-4 sm:p-8">
    <!-- Label -->
    <p class="px-2 font-mono text-muted-foreground text-sm">// SYSTEM_CAPABILITIES</p>

    <!-- Grid -->
    <div hlmCardContent class="gap-3 grid grid-cols-1 sm:grid-cols-2 p-0">
      @for (cap of capabilities(); track cap.title; let i = $index) {
        <div
          hlmCard
          appScrollAnimate="fade-up"
          [animDelay]="i * 100"
          class="flex-row items-start gap-3 hover:bg-muted/30 hover:shadow-md p-4 hover:ring-primary/40 transition-all duration-200 cursor-default"
        >
          <div
            class="flex justify-center items-center mt-0.5 border border-primary/40 rounded-md w-9 h-9 text-primary shrink-0"
          >
            <ng-icon [name]="cap.icon" class="text-sm" />
          </div>
          <div class="flex flex-col gap-1 min-w-0">
            <h3 hlmCardTitle class="font-semibold text-sm">{{ cap.title }}</h3>
            <p hlmCardDescription class="text-xs break-words leading-relaxed">
              {{ cap.description }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
