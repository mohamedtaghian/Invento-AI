<section class="flex items-center px-4 sm:px-8 md:px-16 lg:px-24 py-10">
  <div class="flex flex-col gap-6 w-full max-w-2xl">
    <!-- Badge with Shimmer -->
    <span
      appScrollAnimate="fade-left"
      [animDelay]="0"
      hlmBadge
      variant="outline"
      class="relative gap-2 px-3 py-1.5 w-fit overflow-hidden font-mono text-xs hero-badge"
    >
      <span class="absolute inset-0 pointer-events-none hero-badge__shimmer"></span>
      <span class="relative bg-primary rounded-full w-2 h-2 animate-pulse"></span>
      <span class="relative">SYSTEM_ONLINE — v0.1.0-beta</span>
    </span>

    <!-- Title -->
    <h1 class="flex flex-col gap-1 leading-tight">
      <span
        appScrollAnimate="fade-up"
        [animDelay]="100"
        class="block font-bold text-foreground text-5xl md:text-6xl lg:text-7xl"
      >
        Program
      </span>

      <!-- Typing Animation -->
      <span appScrollAnimate="fade-up" [animDelay]="200" class="block min-h-[1.2em]">
        <app-typing-text [words]="typingWords" />
      </span>
    </h1>

    <!-- Description -->
    <p
      appScrollAnimate="fade-up"
      [animDelay]="300"
      class="max-w-lg text-muted-foreground text-base leading-relaxed"
    >
      BuilderAI is an end-to-end AI construction engine that translates abstract business ideas into
      concrete data schemas, CSS variables, and production-ready Spartan storefronts.
    </p>

    <!-- Actions -->
    <div appScrollAnimate="fade-up" [animDelay]="400" class="flex sm:flex-row flex-col gap-3 mt-2">
      <a hlmBtn routerLink="/brain" class="justify-center gap-2 w-full sm:w-auto font-mono text-sm">
        <ng-icon name="lucideBolt" />
        BEGIN CONSTRUCTION →
      </a>
      <button
        hlmBtn
        variant="outline"
        class="justify-center gap-2 w-full sm:w-auto font-mono text-sm"
      >
        <ng-icon name="lucideCode" />
        VIEW_ARCHITECTURE
      </button>
    </div>
  </div>
</section>
