<section class="flex items-center px-8 md:px-16 lg:px-24 py-6">
  <div class="flex flex-col gap-6 max-w-2xl">
    <!-- Badge -->
    <span hlmBadge variant="outline" class="gap-2 px-3 py-1.5 w-fit font-mono text-xs">
      <span class="bg-primary rounded-full w-2 h-2"></span>
      SYSTEM_ONLINE — v0.1.0-beta
    </span>

    <!-- Title -->
    <h1 class="leading-tight">
      <span class="block font-bold text-foreground text-5xl md:text-6xl lg:text-7xl">
        Program
      </span>
      <span class="block font-bold text-primary text-5xl md:text-6xl lg:text-7xl">
        Your Business
      </span>
    </h1>

    <!-- Description -->
    <p class="max-w-lg text-muted-foreground text-base leading-relaxed">
      BuilderAI is an end-to-end AI construction engine that translates abstract business ideas into
      concrete data schemas, CSS variables, and production-ready Spartan storefronts.
    </p>

    <!-- Actions -->
    <div class="flex flex-wrap gap-4 mt-2">
      <a hlmBtn routerLink="/brain" class="gap-2 font-mono text-sm">
        <ng-icon name="lucideBolt" />
        BEGIN CONSTRUCTION →
      </a>

      <button hlmBtn variant="outline" class="gap-2 font-mono text-sm">
        <ng-icon name="lucideCode" />
        VIEW_ARCHITECTURE
      </button>
    </div>
  </div>
</section>
