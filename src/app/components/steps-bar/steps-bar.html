<div class="bg-card shadow-sm py-4 border-border border-b w-full overflow-hidden">
  <div class="relative flex mx-auto px-4 sm:px-6 max-w-5xl">
    <div class="md:hidden top-4 right-[12.5%] left-[12.5%] z-0 absolute bg-border h-0.5"></div>

    <ol
      class="z-10 relative flex md:flex-wrap justify-between md:justify-center items-start md:items-center gap-y-4 md:gap-2 lg:gap-6 w-full font-medium text-sm"
    >
      <li class="flex md:flex-row flex-col flex-1 md:flex-none items-center md:gap-2 lg:gap-3">
        <a
          routerLink="/brain"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaBrain="routerLinkActive"
          class="z-10 flex md:flex-row flex-col items-center gap-1.5 md:gap-2 bg-card md:bg-transparent md:px-3 md:py-1.5 border rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-ring transition-all duration-200"
          [ngClass]="
            rlaBrain.isActive
              ? 'border-transparent md:border-primary/50 md:bg-primary/10'
              : 'border-transparent md:hover:bg-muted/50'
          "
        >
          <span
            class="flex justify-center items-center rounded-full ring-8 ring-card md:ring-0 w-8 md:w-5 h-8 md:h-5 font-bold text-xs transition-all duration-300 shrink-0"
            [ngClass]="
              rlaBrain.isActive
                ? 'bg-primary text-primary-foreground shadow-[0_0_12px_var(--primary)] border-none'
                : 'bg-muted text-muted-foreground border border-border md:border-none md:bg-muted'
            "
          >
            1
          </span>
          <span
            class="text-[10px] sm:text-xs md:text-sm text-center whitespace-nowrap transition-colors"
            [ngClass]="
              rlaBrain.isActive
                ? 'text-foreground md:text-primary'
                : 'text-muted-foreground md:hover:text-foreground'
            "
          >
            Brainstorm
          </span>
        </a>
        <span class="hidden md:block ml-1 lg:ml-3 font-normal text-muted">❯</span>
      </li>

      <li class="flex md:flex-row flex-col flex-1 md:flex-none items-center md:gap-2 lg:gap-3">
        <a
          routerLink="/ai-builder"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaInterview="routerLinkActive"
          class="z-10 flex md:flex-row flex-col items-center gap-1.5 md:gap-2 bg-card md:bg-transparent md:px-3 md:py-1.5 border rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-ring transition-all duration-200"
          [ngClass]="
            rlaInterview.isActive
              ? 'border-transparent md:border-primary/50 md:bg-primary/10'
              : 'border-transparent md:hover:bg-muted/50'
          "
        >
          <span
            class="flex justify-center items-center rounded-full ring-8 ring-card md:ring-0 w-8 md:w-5 h-8 md:h-5 font-bold text-xs transition-all duration-300 shrink-0"
            [ngClass]="
              rlaInterview.isActive
                ? 'bg-primary text-primary-foreground shadow-[0_0_12px_var(--primary)] border-none'
                : 'bg-muted text-muted-foreground border border-border md:border-none md:bg-muted'
            "
          >
            2
          </span>
          <span
            class="text-[10px] sm:text-xs md:text-sm text-center whitespace-nowrap transition-colors"
            [ngClass]="
              rlaInterview.isActive
                ? 'text-foreground md:text-primary'
                : 'text-muted-foreground md:hover:text-foreground'
            "
          >
            AI Interview
          </span>
        </a>
        <span class="hidden md:block ml-1 lg:ml-3 font-normal text-muted">❯</span>
      </li>

      <li class="flex md:flex-row flex-col flex-1 md:flex-none items-center md:gap-2 lg:gap-3">
        <a
          routerLink="/validation"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaValidation="routerLinkActive"
          class="z-10 flex md:flex-row flex-col items-center gap-1.5 md:gap-2 bg-card md:bg-transparent md:px-3 md:py-1.5 border rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-ring transition-all duration-200"
          [ngClass]="
            rlaValidation.isActive
              ? 'border-transparent md:border-primary/50 md:bg-primary/10'
              : 'border-transparent md:hover:bg-muted/50'
          "
        >
          <span
            class="flex justify-center items-center rounded-full ring-8 ring-card md:ring-0 w-8 md:w-5 h-8 md:h-5 font-bold text-xs transition-all duration-300 shrink-0"
            [ngClass]="
              rlaValidation.isActive
                ? 'bg-primary text-primary-foreground shadow-[0_0_12px_var(--primary)] border-none'
                : 'bg-muted text-muted-foreground border border-border md:border-none md:bg-muted'
            "
          >
            3
          </span>
          <span
            class="text-[10px] sm:text-xs md:text-sm text-center whitespace-nowrap transition-colors"
            [ngClass]="
              rlaValidation.isActive
                ? 'text-foreground md:text-primary'
                : 'text-muted-foreground md:hover:text-foreground'
            "
          >
            Validation
          </span>
        </a>
        <span class="hidden md:block ml-1 lg:ml-3 font-normal text-muted">❯</span>
      </li>

      <li class="flex md:flex-row flex-col flex-1 md:flex-none items-center md:gap-2 lg:gap-3">
        <a
          routerLink="/preview"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaPreview="routerLinkActive"
          class="z-10 flex md:flex-row flex-col items-center gap-1.5 md:gap-2 bg-card md:bg-transparent md:px-3 md:py-1.5 border rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-ring transition-all duration-200"
          [ngClass]="
            rlaPreview.isActive
              ? 'border-transparent md:border-primary/50 md:bg-primary/10'
              : 'border-transparent md:hover:bg-muted/50'
          "
        >
          <span
            class="flex justify-center items-center rounded-full ring-8 ring-card md:ring-0 w-8 md:w-5 h-8 md:h-5 font-bold text-xs transition-all duration-300 shrink-0"
            [ngClass]="
              rlaPreview.isActive
                ? 'bg-primary text-primary-foreground shadow-[0_0_12px_var(--primary)] border-none'
                : 'bg-muted text-muted-foreground border border-border md:border-none md:bg-muted'
            "
          >
            3
          </span>
          <span
            class="text-[10px] sm:text-xs md:text-sm text-center whitespace-nowrap transition-colors"
            [ngClass]="
              rlaPreview.isActive
                ? 'text-foreground md:text-primary'
                : 'text-muted-foreground md:hover:text-foreground'
            "
          >
            Preview
          </span>
        </a>
      </li>

      <!-- Step 4: Validation -->
      <li class="flex items-center gap-2 md:gap-3">
        <a
          routerLink="/validation"
          routerLinkActive="bg-primary/10 border-primary text-primary"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaValidation="routerLinkActive"
          class="flex items-center gap-2 px-3 py-1.5 border border-transparent rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-ring transition-all duration-200"
          [ngClass]="!rlaValidation.isActive ? 'text-muted-foreground hover:text-foreground' : ''"
        >
          <span
            class="flex justify-center items-center rounded-full w-5 h-5 font-bold text-xs transition-colors"
            [ngClass]="
              rlaValidation.isActive
                ? 'bg-primary text-primary-foreground'
                : 'bg-muted text-muted-foreground'
            "
          >
            4
          </span>
          <span class="whitespace-nowrap">Validation</span>
        </a>
        <span class="font-normal text-muted-foreground/40">❯</span>
      </li>
    </ol>
  </div>
</div>
