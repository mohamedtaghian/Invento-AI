<div class="bg-card shadow-sm py-4 border-border border-b w-full">
  <div class="flex justify-between items-center mx-auto px-6 max-w-5xl">
    <ol
      class="flex flex-wrap justify-center items-center gap-2 sm:gap-4 md:gap-6 w-full font-medium text-sm"
    >
      <!-- Step 1: Brainstorm -->
      <li class="flex items-center gap-2 md:gap-3">
        <a
          routerLink="/brain"
          routerLinkActive="bg-primary/10 border-primary text-primary"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaBrain="routerLinkActive"
          class="flex items-center gap-2 px-3 py-1.5 border border-transparent rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-ring transition-all duration-200"
          [ngClass]="!rlaBrain.isActive ? 'text-muted-foreground hover:text-foreground' : ''"
        >
          <span
            class="flex justify-center items-center rounded-full w-5 h-5 font-bold text-xs transition-colors"
            [ngClass]="
              rlaBrain.isActive
                ? 'bg-primary text-primary-foreground'
                : 'bg-muted text-muted-foreground'
            "
          >
            1
          </span>
          <span class="whitespace-nowrap">Brainstorm</span>
        </a>
        <span class="font-normal text-muted-foreground/40">❯</span>
      </li>

      <!-- Step 2: AI Interview -->
      <li class="flex items-center gap-2 md:gap-3">
        <a
          routerLink="/ai-builder"
          routerLinkActive="bg-primary/10 border-primary text-primary"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaInterview="routerLinkActive"
          class="flex items-center gap-2 px-3 py-1.5 border border-transparent rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-ring transition-all duration-200"
          [ngClass]="!rlaInterview.isActive ? 'text-muted-foreground hover:text-foreground' : ''"
        >
          <span
            class="flex justify-center items-center rounded-full w-5 h-5 font-bold text-xs transition-colors"
            [ngClass]="
              rlaInterview.isActive
                ? 'bg-primary text-primary-foreground'
                : 'bg-muted text-muted-foreground'
            "
          >
            2
          </span>
          <span class="whitespace-nowrap">AI Interview</span>
        </a>
        <span class="font-normal text-muted-foreground/40">❯</span>
      </li>

      <!-- Step 3: Preview -->
      <li class="flex items-center gap-2 md:gap-3">
        <a
          routerLink="/preview"
          routerLinkActive="bg-primary/10 border-primary text-primary"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaPreview="routerLinkActive"
          class="flex items-center gap-2 px-3 py-1.5 border border-transparent rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-ring transition-all duration-200"
          [ngClass]="!rlaPreview.isActive ? 'text-muted-foreground hover:text-foreground' : ''"
        >
          <span
            class="flex justify-center items-center rounded-full w-5 h-5 font-bold text-xs transition-colors"
            [ngClass]="
              rlaPreview.isActive
                ? 'bg-primary text-primary-foreground'
                : 'bg-muted text-muted-foreground'
            "
          >
            3
          </span>
          <span class="whitespace-nowrap">Preview</span>
        </a>
      </li>

      <!-- Step 4: Validation -->
      <li class="flex items-center gap-2 md:gap-3">
        <a
          routerLink="/validation"
          routerLinkActive="bg-primary/10 border-primary text-primary"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaValidation="routerLinkActive"
          class="flex items-center gap-2 px-3 py-1.5 border border-transparent rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-ring transition-all duration-200"
          [ngClass]="!rlaValidation.isActive ? 'text-muted-foreground hover:text-foreground' : ''"
        >
          <span
            class="flex justify-center items-center rounded-full w-5 h-5 font-bold text-xs transition-colors"
            [ngClass]="
              rlaValidation.isActive
                ? 'bg-primary text-primary-foreground'
                : 'bg-muted text-muted-foreground'
            "
          >
            4
          </span>
          <span class="whitespace-nowrap">Validation</span>
        </a>
        <span class="font-normal text-muted-foreground/40">❯</span>
      </li>
    </ol>
  </div>
</div>
