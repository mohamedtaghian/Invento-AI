<div class="flex flex-col page-header">
  <div class="flex justify-between items-center gap-2.5 my-2.5">
    <app-page-badge
      [badgeText]="badgeText()"
      [animationSpeed]="animationSpeed()"
      [glowColor]="glowColor()"
    />
  </div>

  <h1
    class="mb-2 font-work font-bold text-3xl md:text-4xl tracking-tight"
    style="color: var(--foreground)"
  >
    {{ title() }} <span style="color: var(--primary)">{{ accentTitle() }}</span>
  </h1>

  @if (description()) {
    <p style="color: var(--foreground)">
      {{ description() }}
    </p>
  }
</div>
