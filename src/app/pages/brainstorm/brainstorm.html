<div class="flex flex-col gap-9">
  <div class="flex flex-col gap-2">
    <div class="flex items-center gap-3">
      <span hlmBadge>STEP 01</span>
      <span class="text-muted-foreground text-xs">BRAINSTORM_MODULE</span>
    </div>
    <div class="flex flex-col gap-3">
      <h1 class="font-bold text-2xl md:text-4xl lg:text-5xl tracking-tight">
        Program Your <span class="text-primary">Business Concept</span>
      </h1>
      <p class="text-muted-foreground text-sm md:text-xl">
        Describe the idea in raw terms. BuilderAI will extract intent, architecture, and schema from
        your input.
      </p>
    </div>
  </div>
  <div class="flex md:flex-row flex-col gap-7">
    <div class="flex flex-col gap-5 lg:w-3/4">
      <textarea
        hlmTextarea
        placeholder="e.g. A premium fashion brand targeting Gen Z..."
        class="bg-muted border border-border h-80 text-base! resize-none"
        [formControl]="descriptionControl"
      ></textarea>
      <button
        hlmBtn
        class="flex items-center gap-2 md:px-9 py-7 md:w-fit"
        [disabled]="descriptionControl.value.length < 11"
      >
        <ng-icon name="heroBolt" /> <span>INITIATE AI INTERVIEW</span>
        <ng-icon name="heroArrowRight" />
      </button>
    </div>
    <div class="flex flex-col lg:flex-1 gap-4">
      <h2 class="text-muted-foreground/50 text-xs">// CONTEXT_CHECKLIST</h2>
      <hlm-item-group>
        @for (item of contextChecklist; track item.id) {
          <hlm-item variant="muted" class="border border-border">
            <hlm-item-content>
              <p hlmItemDescription>
                <span hlmBadge class="bg-muted mr-2 rounded-full size-5 text-muted-foreground">{{
                  item.id
                }}</span
                >{{ item.content }}
              </p>
            </hlm-item-content>
          </hlm-item>
        }
      </hlm-item-group>
    </div>
  </div>
</div>
