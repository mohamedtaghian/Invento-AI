<div class="flex flex-col h-full">
  <div class="flex-1 overflow-auto p-3 space-y-3">
    @for (msg of messages(); track $index) {
      <div
        class="flex gap-2"
        [class.flex-row-reverse]="msg.role === 'user'"
      >
        <div
          class="shrink-0 size-7 rounded-full flex items-center justify-center text-xs"
          [class.bg-primary/10]="msg.role === 'assistant'"
          [class.bg-muted]="msg.role === 'user'"
        >
          <ng-icon
            [name]="msg.role === 'assistant' ? 'lucideBot' : 'lucideUser'"
            size="14"
          />
        </div>
        <div
          class="rounded-lg px-3 py-2 text-sm max-w-[80%]"
          [class.bg-primary/10]="msg.role === 'assistant'"
          [class.bg-muted]="msg.role === 'user'"
        >
          {{ msg.content }}
        </div>
      </div>
    }
  </div>
  <div class="border-t border-border p-3">
    <div class="flex gap-2">
      <input
        #inputEl
        type="text"
        [placeholder]="placeholder()"
        class="flex-1 rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
        (keydown.enter)="send(inputEl)"
      />
      <button
        class="inline-flex items-center justify-center rounded-md bg-primary text-primary-foreground px-3 py-2 text-sm font-medium hover:bg-primary/90"
        (click)="send(inputEl)"
        aria-label="Send"
      >
        <ng-icon name="lucideSend" size="16" />
      </button>
    </div>
  </div>
</div>
