<div class="fixed bottom-4 end-4 z-50">
  @if (isOpen()) {
    <div class="mb-3 w-80 h-96 rounded-lg border border-border bg-card shadow-lg flex flex-col overflow-hidden">
      <div class="flex items-center justify-between p-3 border-b border-border shrink-0">
        <span class="font-semibold text-sm">{{ 'chat_title' | translate }}</span>
        <button
          class="inline-flex items-center justify-center rounded-md hover:bg-muted size-7"
          (click)="toggle()"
          aria-label="Close"
        >
          <ng-icon name="lucideX" size="16" />
        </button>
      </div>
      <app-chat-ui
        class="flex-1 flex flex-col overflow-hidden"
        [messages]="messages()"
        (sendMessage)="onSend($event)"
      />
    </div>
  }
  <button
    class="ms-auto flex items-center justify-center size-12 rounded-full bg-primary text-primary-foreground shadow-lg hover:bg-primary/90"
    (click)="toggle()"
    [attr.aria-label]="'chat_open' | translate"
  >
    <ng-icon name="lucideMessageSquare" size="24" />
  </button>
</div>
