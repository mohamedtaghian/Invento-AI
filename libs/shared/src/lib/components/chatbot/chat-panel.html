<div class="flex flex-col h-full rounded-lg border border-border bg-card overflow-hidden">
  @if (showHeader()) {
    <div class="flex items-center justify-between p-3 border-b border-border shrink-0">
      <div class="flex items-center gap-2">
        <ng-icon name="lucideBot" size="18" class="text-primary" />
        <span class="font-semibold text-sm">{{ title() | translate }}</span>
      </div>
      <button
        class="inline-flex items-center justify-center rounded-md hover:bg-muted size-7"
        (click)="closePanel.emit()"
        [attr.aria-label]="'Close'"
      >
        <ng-icon name="lucideX" size="16" />
      </button>
    </div>
  }
  <app-chat-ui
    class="flex-1 flex flex-col overflow-hidden"
    [messages]="messages()"
    (sendMessage)="onSend($event)"
  />
</div>
